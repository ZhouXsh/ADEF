name: Run 0904 fusion generator

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/kick_fusion_0904.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Generate fusion training scripts
        run: |
          python -m py_compile .github/scripts/gen_fusion_0904.py
          python .github/scripts/gen_fusion_0904.py

      - name: Validate generated files
        run: |
          python -m py_compile \
            train_Unification_twostage0904_fusion_conservative_ema.py \
            train_Unification_twostage0904_fusion_plain_tail_ema.py \
            train_Unification_twostage0904_fusion_balanced_decay_ema.py \
            train_Unification_twostage0904_fusion_natural_tail_ema.py \
            train_Unification_twostage0904_fusion_lowaudio_protect_ema.py \
            train_Unification_twostage0904_fusion_freezeaudio_protect_ema.py
          git diff --check

      - name: Commit generated files
        run: |
          rm -f .github/workflows/kick_fusion_0904.yml
          rm -f .github/workflows/generate_fusion_variants_0904.yml
          rm -f .github/scripts/gen_fusion_0904.py
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            train_Unification_twostage0904_fusion_conservative_ema.py \
            train_Unification_twostage0904_fusion_plain_tail_ema.py \
            train_Unification_twostage0904_fusion_balanced_decay_ema.py \
            train_Unification_twostage0904_fusion_natural_tail_ema.py \
            train_Unification_twostage0904_fusion_lowaudio_protect_ema.py \
            train_Unification_twostage0904_fusion_freezeaudio_protect_ema.py \
            FUSION_VARIANTS_0904.md
          git add -u -- .github/workflows/kick_fusion_0904.yml .github/workflows/generate_fusion_variants_0904.yml .github/scripts/gen_fusion_0904.py
          git diff --cached --check
          git commit -m 'add 0904 fusion tail-refinement training variants [skip ci]'
          git push origin HEAD:develop
