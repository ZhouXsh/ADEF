name: Run checked ADEF variant generator

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/run_corrected_adef_variant_generator.yml

permissions:
  contents: write

jobs:
  generate:
    if: contains(github.event.head_commit.message, '[run-variant-generator]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify and run full-copy generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate_adef_model_training_variants.py')
          text = path.read_text(encoding='utf-8')

          old_doc = '    """Frame-preserving multi-scale temporal refinement for speech features."""'
          new_doc = '    # Frame-preserving multi-scale temporal refinement for speech features.'
          if text.count(old_doc) != 1:
              raise RuntimeError(f'Expected one nested docstring, found {text.count(old_doc)}')
          text = text.replace(old_doc, new_doc, 1)

          old_check = '''    if count != 1:
        raise RuntimeError(f"{label}: expected one match, found {count}")
    return text.replace(old, new, 1)'''
          new_check = '''    if count < 1:
        raise RuntimeError(f"{label}: expected at least one match, found {count}")
    return text.replace(old, new, 1)'''
          if text.count(old_check) != 1:
              raise RuntimeError(f'Expected one replace_once validation block, found {text.count(old_check)}')
          text = text.replace(old_check, new_check, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/generate_adef_model_training_variants.py
          python scripts/generate_adef_model_training_variants.py

      - name: Verify generated Python files
        shell: bash
        run: |
          python -m py_compile \
            src/modules/emotion_dit_Unification_jianhua0803_lipaware.py \
            src/modules/emotion_dit_Unification_jianhua0803_audio_pyramid.py \
            src/modules/emotion_dit_Unification_jianhua0803_channelgate.py \
            src/modules/emotion_dit_Unification_jianhua0803_minsnr_ema.py \
            train_Unification_jianhua0803_lipaware.py \
            train_Unification_jianhua0803_audio_pyramid.py \
            train_Unification_jianhua0803_channelgate.py \
            train_Unification_jianhua0803_minsnr_ema.py

      - name: Commit generated variants to develop
        shell: bash
        run: |
          rm -f \
            .github/workflows/generate_adef_optimization_variants.yml \
            .github/workflows/run_corrected_adef_variant_generator.yml \
            scripts/generate_adef_model_training_variants.py
          git config user.name "ADEF Variant Generator"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            src/modules/emotion_dit_Unification_jianhua0803_lipaware.py \
            src/modules/emotion_dit_Unification_jianhua0803_audio_pyramid.py \
            src/modules/emotion_dit_Unification_jianhua0803_channelgate.py \
            src/modules/emotion_dit_Unification_jianhua0803_minsnr_ema.py \
            train_Unification_jianhua0803_lipaware.py \
            train_Unification_jianhua0803_audio_pyramid.py \
            train_Unification_jianhua0803_channelgate.py \
            train_Unification_jianhua0803_minsnr_ema.py \
            docs/MODEL_TRAINING_OPTIMIZATION_VARIANTS.md
          git add -u -- \
            .github/workflows/generate_adef_optimization_variants.yml \
            .github/workflows/run_corrected_adef_variant_generator.yml \
            scripts/generate_adef_model_training_variants.py
          git commit -m "add full-copy model and training optimization variants [skip ci]"
          git push origin HEAD:develop
