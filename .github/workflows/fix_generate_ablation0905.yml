name: Fix and generate ICASSP27 ablations 0905

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fix_generate_ablation0905.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch generator replacement semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/ablation_codegen_0905.py')
          s = p.read_text(encoding='utf-8')
          anchor = "def replace_once(text, old, new, label='replace_once'):\n    return must_replace(text, old, new, expected=1, label=label)\n"
          helper = anchor + "\n\ndef replace_first(text, old, new, label='replace_first'):\n    if old not in text:\n        raise RuntimeError(f'{label}: pattern not found')\n    return text.replace(old, new, 1)\n"
          if 'def replace_first(' not in s:
              if anchor not in s:
                  raise RuntimeError('replace_once anchor not found')
              s = s.replace(anchor, helper, 1)
          first_block = """    text = replace_once(
                  text,
                  'def forward(self, tgt, memory, t_emb, memory_mask=None, tgt_mask=None):',
                  'def forward(self, tgt, memory, t_emb, memory_mask=None, tgt_mask=None, emotion_shift=None, emotion_scale=None):',
                  'DiTDecoderLayer.forward signature',
              )
          """
          first_new = first_block.replace('text = replace_once(', 'text = replace_first(', 1)
          if first_block in s:
              s = s.replace(first_block, first_new, 1)
          partition_block = """    text = replace_once(
                  text,
                  '            align_mask_width=align_mask_width,\\n        )',
                  '            align_mask_width=align_mask_width,\\n            partition_keypoint_indices=partition_keypoint_indices,\\n        )',
                  'partition wrapper super arg',
              )
          """
          partition_new = partition_block.replace('text = replace_once(', 'text = replace_first(', 1)
          if partition_block in s:
              s = s.replace(partition_block, partition_new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Generate independent ablation files
        run: python .github/ablation_codegen_0905.py

      - name: Validate generated Python and independence
        run: |
          python -m py_compile train_Ablation0905_*.py src/modules/emotion_dit_ablation0905_*.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          trains = sorted(Path('.').glob('train_Ablation0905_*.py'))
          models = sorted(Path('src/modules').glob('emotion_dit_ablation0905_*.py'))
          assert len(trains) == 6, trains
          assert len(models) == 12, models
          for train in trains:
              text = train.read_text(encoding='utf-8')
              assert 'from src.modules.emotion_dit_ablation0905_' in text
              for other in trains:
                  if other != train:
                      assert other.stem not in text
          print('validated', len(trains), 'training files and', len(models), 'model files')
          PY

      - name: Commit generated ablations
        run: |
          rm -f .github/ablation_codegen_0905.py
          rm -f .github/workflows/generate_ablation0905.yml
          rm -f .github/workflows/fix_generate_ablation0905.yml
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ABLATION_ICASSP27_0905.md train_Ablation0905_*.py src/modules/emotion_dit_ablation0905_*.py
          git add -u -- .github
          git diff --cached --check
          git commit -m 'add ICASSP27 controlled ablation suite 0905 [skip ci]'
          git push origin HEAD:develop
