name: Finalize ADEF optimization variants

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/finalize_adef_optimization_variants.yml

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-variants]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply final semantic fixes
        shell: bash
        run: |
          python -m py_compile scripts/finalize_adef_optimization_variants.py
          python scripts/finalize_adef_optimization_variants.py

      - name: Compile all generated variants
        shell: bash
        run: |
          python -m py_compile \
            src/modules/emotion_dit_Unification_jianhua0803_lipaware.py \
            src/modules/emotion_dit_Unification_jianhua0803_audio_pyramid.py \
            src/modules/emotion_dit_Unification_jianhua0803_channelgate.py \
            src/modules/emotion_dit_Unification_jianhua0803_minsnr_ema.py \
            train_Unification_jianhua0803_lipaware.py \
            train_Unification_jianhua0803_audio_pyramid.py \
            train_Unification_jianhua0803_channelgate.py \
            train_Unification_jianhua0803_minsnr_ema.py

      - name: Commit final variants
        shell: bash
        run: |
          rm -f \
            .github/workflows/finalize_adef_optimization_variants.yml \
            scripts/finalize_adef_optimization_variants.py
          git config user.name "ADEF Variant Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            src/modules/emotion_dit_Unification_jianhua0803_lipaware.py \
            src/modules/emotion_dit_Unification_jianhua0803_audio_pyramid.py \
            src/modules/emotion_dit_Unification_jianhua0803_channelgate.py \
            src/modules/emotion_dit_Unification_jianhua0803_minsnr_ema.py \
            train_Unification_jianhua0803_lipaware.py \
            train_Unification_jianhua0803_audio_pyramid.py \
            train_Unification_jianhua0803_channelgate.py \
            train_Unification_jianhua0803_minsnr_ema.py \
            docs/MODEL_TRAINING_OPTIMIZATION_VARIANTS.md
          git add -u -- \
            .github/workflows/finalize_adef_optimization_variants.yml \
            scripts/finalize_adef_optimization_variants.py
          git commit -m "finalize full-copy optimization variants [skip ci]"
          git push origin HEAD:develop
