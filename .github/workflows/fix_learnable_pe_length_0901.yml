name: Fix learnable PE length 0901

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fix_learnable_pe_length_0901.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Patch runtime-corrected denoiser PE length
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/modules/emotion_dit_Unification_jianhua0803.py')
          text = path.read_text(encoding='utf-8')

          old = '''class DenoisingNetwork(_legacy.DenoisingNetwork):\n    \"\"\"Legacy denoiser with a safe default indicator when the feature is enabled.\"\"\"\n\n    def forward(self, motion_feat, audio_feat, prev_motion_feat, prev_audio_feat,\n                step, indicator=None):\n'''

          new = '''class DenoisingNetwork(_legacy.DenoisingNetwork):\n    \"\"\"Legacy denoiser with corrected sequence PE and safe indicator handling.\"\"\"\n\n    def __init__(self, *args, **kwargs):\n        super().__init__(*args, **kwargs)\n\n        # The denoiser input sequence is exactly [prev_motion, current_motion],\n        # i.e. n_prev_motions + n_motions tokens. The diffusion-step embedding\n        # is injected separately into DiTDecoder and is NOT concatenated as an\n        # extra token. The legacy learnable PE allocated one unused extra token\n        # (1 + n_prev_motions + n_motions), which causes 80-vs-81 broadcasting\n        # failure as soon as learnable PE is actually enabled by the 0901 scripts.\n        if self.use_learnable_pe:\n            expected_seq_len = self.n_prev_motions + self.n_motions\n            if self.PE.shape[1] != expected_seq_len:\n                if self.PE.shape[1] < expected_seq_len:\n                    raise ValueError(\n                        f\"Learnable PE is too short: {self.PE.shape[1]} < {expected_seq_len}\"\n                    )\n                self.PE = torch.nn.Parameter(\n                    self.PE[:, :expected_seq_len].detach().clone()\n                )\n\n    def forward(self, motion_feat, audio_feat, prev_motion_feat, prev_audio_feat,\n                step, indicator=None):\n'''

          if old not in text:
              raise RuntimeError('Expected DenoisingNetwork block not found; refusing blind patch')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched files
        run: |
          python -m py_compile \
            src/modules/emotion_dit_Unification_jianhua0803.py \
            src/modules/emotion_dit_Unification_jianhua0803_legacy.py \
            train_Unification_twostage0901_schedule_ema.py \
            train_Unification_twostage0901_sharedcond_ema.py \
            train_Unification_twostage0901_sharedcond_minsnr_ema.py \
            train_Unification_twostage0901_sharedcond_balanced_ema.py \
            train_Unification_twostage0901_sharedcond_minsnr_balanced_ema.py \
            train_Unification_twostage0901_sharedcond_minsnr_balanced_replay_ema.py
          grep -q 'expected_seq_len = self.n_prev_motions + self.n_motions' src/modules/emotion_dit_Unification_jianhua0803.py
          git diff --check

      - name: Commit fix
        run: |
          rm -f .github/workflows/fix_learnable_pe_length_0901.yml
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/emotion_dit_Unification_jianhua0803.py
          git add -u -- .github/workflows/fix_learnable_pe_length_0901.yml
          git diff --cached --check
          git commit -m 'fix learnable positional encoding length for 0901 training [skip ci]'
          git push origin HEAD:develop
