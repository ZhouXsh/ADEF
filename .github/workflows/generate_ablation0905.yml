name: Generate ICASSP27 ablations 0905

on:
  push:
    branches: [develop]
    paths:
      - '.github/ablation_codegen_0905.py'
      - '.github/workflows/generate_ablation0905.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate independent ablation files
        run: |
          python .github/ablation_codegen_0905.py

      - name: Validate generated Python
        run: |
          python -m py_compile train_Ablation0905_*.py src/modules/emotion_dit_ablation0905_*.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          trains = sorted(Path('.').glob('train_Ablation0905_*.py'))
          models = sorted(Path('src/modules').glob('emotion_dit_ablation0905_*.py'))
          assert len(trains) == 6, trains
          assert len(models) == 12, models
          for train in trains:
              text = train.read_text(encoding='utf-8')
              assert 'from src.modules.emotion_dit_ablation0905_' in text
              for other in trains:
                  if other != train:
                      assert other.stem not in text
          print('validated', len(trains), 'training files and', len(models), 'model files')
          PY

      - name: Commit generated ablations
        run: |
          rm -f .github/ablation_codegen_0905.py
          rm -f .github/workflows/generate_ablation0905.yml
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ABLATION_ICASSP27_0905.md train_Ablation0905_*.py src/modules/emotion_dit_ablation0905_*.py
          git add -u -- .github/ablation_codegen_0905.py .github/workflows/generate_ablation0905.yml
          git diff --cached --check
          git commit -m 'add ICASSP27 controlled ablation suite 0905 [skip ci]'
          git push origin HEAD:develop
