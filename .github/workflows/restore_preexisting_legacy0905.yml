name: Restore pre-existing legacy files 0905
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/restore_preexisting_legacy0905.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Restore only pre-existing files touched by cleanup
        run: |
          git checkout 23daed662deafaf471cadb5becd98e58373516d3 -- \
            src/modules/emotion_dit_Unification_jianhua0803.py \
            src/modules/emotion_dit_Unification_jianhua0803_legacy.py \
            src/dataset/dataset_EmotionLevel_clear_jianhua0803.py \
            src/dataset/dataset_EmotionLevel_clear_jianhua0803_legacy.py \
            src/utils/helper.py \
            src/utils/helper_legacy.py
      - name: Validate restored layout
        run: |
          test -f src/modules/emotion_dit_Unification_jianhua0803_legacy.py
          test -f src/dataset/dataset_EmotionLevel_clear_jianhua0803_legacy.py
          test -f src/utils/helper_legacy.py
          python -m py_compile \
            src/modules/emotion_dit_Unification_jianhua0803.py \
            src/modules/emotion_dit_Unification_jianhua0803_legacy.py \
            src/dataset/dataset_EmotionLevel_clear_jianhua0803.py \
            src/dataset/dataset_EmotionLevel_clear_jianhua0803_legacy.py \
            src/utils/helper.py \
            src/utils/helper_legacy.py
      - name: Commit restoration
        run: |
          rm -f .github/workflows/restore_preexisting_legacy0905.yml
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'restore pre-existing legacy files and wrappers [skip ci]'
          git push origin HEAD:develop
