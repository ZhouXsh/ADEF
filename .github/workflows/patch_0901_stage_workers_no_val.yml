name: Patch 0901 stage workers and disable validation

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/patch_0901_stage_workers_no_val.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Patch six 0901 variants
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('train_Unification_twostage0901_schedule_ema.py'),
              Path('train_Unification_twostage0901_sharedcond_ema.py'),
              Path('train_Unification_twostage0901_sharedcond_minsnr_ema.py'),
              Path('train_Unification_twostage0901_sharedcond_balanced_ema.py'),
              Path('train_Unification_twostage0901_sharedcond_minsnr_balanced_ema.py'),
              Path('train_Unification_twostage0901_sharedcond_minsnr_balanced_replay_ema.py'),
          ]

          def rep(text, old, new, label, path):
              if old not in text:
                  raise RuntimeError(f'{path}: cannot find {label}')
              return text.replace(old, new, 1)

          for path in paths:
              text = path.read_text(encoding='utf-8')

              if 'import gc\n' not in text:
                  text = rep(text, 'import copy\n', 'import copy\nimport gc\n', 'copy import', path)

              # Add an explicit shutdown path for the two persistent worker pools.
              old = '''        self.counter += 1\n        return batch, is_starting_sample\n\n\nclass ContinuationBatchStream:\n'''
              new = '''        self.counter += 1\n        return batch, is_starting_sample\n\n    def close(self):\n        \"\"\"Shut down both persistent DataLoader worker pools immediately.\"\"\"\n        for iterator_name in ("random_iterator", "start_iterator"):\n            iterator = getattr(self, iterator_name, None)\n            if iterator is not None:\n                shutdown = getattr(iterator, "_shutdown_workers", None)\n                if shutdown is not None:\n                    try:\n                        shutdown()\n                    except Exception:\n                        pass\n                setattr(self, iterator_name, None)\n        self.random_loader = None\n        self.start_loader = None\n\n\nclass ContinuationBatchStream:\n'''
              if 'def close(self):\n        """Shut down both persistent DataLoader worker pools immediately.' not in text:
                  text = rep(text, old, new, 'AlternatingBatchStream.close', path)

              old = '''    def __next__(self):\n        batch, self.iterator = _next_restart(self.loader, self.iterator)\n        return batch\n\n\ndef _mead_group_key(metadata):\n'''
              new = '''    def __next__(self):\n        batch, self.iterator = _next_restart(self.loader, self.iterator)\n        return batch\n\n    def close(self):\n        iterator = getattr(self, "iterator", None)\n        if iterator is not None:\n            shutdown = getattr(iterator, "_shutdown_workers", None)\n            if shutdown is not None:\n                try:\n                    shutdown()\n                except Exception:\n                    pass\n        self.iterator = None\n        self.loader = None\n\n\ndef _release_dataset_storage(dataset):\n    \"\"\"Free a finished stage's large in-memory motion dictionary.\"\"\"\n    if dataset is None:\n        return\n    motion_data = getattr(dataset, "motion_data", None)\n    if isinstance(motion_data, dict):\n        motion_data.clear()\n    if hasattr(dataset, "all_data"):\n        dataset.all_data = []\n    gc.collect()\n\n\ndef _mead_group_key(metadata):\n'''
              if 'def _release_dataset_storage(dataset):' not in text:
                  text = rep(text, old, new, 'ContinuationBatchStream.close', path)

              # Create only the worker pool needed by the current phase.
              old = '''    generic_stream = AlternatingBatchStream(\n        generic_dataset,\n        args.batch_size,\n        args.num_workers,\n        args.seed + 11,\n        start_interval=args.start_interval,\n    )\n    mead_stream = AlternatingBatchStream(\n        mead_dataset,\n        args.batch_size,\n        args.num_workers,\n        args.seed + 31,\n        start_interval=args.start_interval,\n        sample_weights=mead_weights,\n    )\n    generic_replay_stream = None\n    if args.generic_replay_interval > 0:\n        generic_replay_stream = ContinuationBatchStream(\n            generic_dataset,\n            args.batch_size,\n            args.num_workers,\n            args.seed + 71,\n        )\n\n    audio_unit = mead_dataset.audio_unit\n'''
              new = '''    # Keep only the current stage's persistent worker pool alive.\n    # Stage 1 creates Generic workers only. MEAD workers are created lazily on\n    # the first MEAD iteration (190001 with the default schedule).\n    generic_stream = None\n    mead_stream = None\n    generic_replay_stream = None\n    if start_iter < args.stage1_iter:\n        generic_stream = AlternatingBatchStream(\n            generic_dataset,\n            args.batch_size,\n            args.num_workers,\n            args.seed + 11,\n            start_interval=args.start_interval,\n        )\n\n    audio_unit = mead_dataset.audio_unit\n'''
              text = rep(text, old, new, 'eager streams', path)

              # Lazy MEAD and replay stream creation.
              old = '''        if phase == 1:\n            (audio, coef_dict), is_starting_sample = next(generic_stream)\n            batch_size = audio.shape[0]\n            emo_index = torch.zeros(batch_size, dtype=torch.long)\n            use_emotion_loss = False\n            data_name = "generic"\n        elif is_generic_replay:\n            if generic_replay_stream is None:\n                raise RuntimeError("generic replay stream was not initialized")\n            audio, coef_dict = next(generic_replay_stream)\n            batch_size = audio.shape[0]\n            emo_index = torch.full(\n                (batch_size,), args.generic_replay_emo_index,\n                dtype=torch.long,\n            )\n            is_starting_sample = False\n            use_emotion_loss = False\n            data_name = "generic_replay"\n        else:\n            (audio, coef_dict, emo_index, _), is_starting_sample = next(mead_stream)\n            use_emotion_loss = True\n            data_name = "mead"\n'''
              new = '''        if phase == 1:\n            if generic_stream is None:\n                generic_stream = AlternatingBatchStream(\n                    generic_dataset,\n                    args.batch_size,\n                    args.num_workers,\n                    args.seed + 11,\n                    start_interval=args.start_interval,\n                )\n            (audio, coef_dict), is_starting_sample = next(generic_stream)\n            batch_size = audio.shape[0]\n            emo_index = torch.zeros(batch_size, dtype=torch.long)\n            use_emotion_loss = False\n            data_name = "generic"\n        elif is_generic_replay:\n            if generic_replay_stream is None:\n                generic_replay_stream = ContinuationBatchStream(\n                    generic_dataset,\n                    args.batch_size,\n                    args.num_workers,\n                    args.seed + 71,\n                )\n            audio, coef_dict = next(generic_replay_stream)\n            batch_size = audio.shape[0]\n            emo_index = torch.full(\n                (batch_size,), args.generic_replay_emo_index,\n                dtype=torch.long,\n            )\n            is_starting_sample = False\n            use_emotion_loss = False\n            data_name = "generic_replay"\n        else:\n            if mead_stream is None:\n                mead_stream = AlternatingBatchStream(\n                    mead_dataset,\n                    args.batch_size,\n                    args.num_workers,\n                    args.seed + 31,\n                    start_interval=args.start_interval,\n                    sample_weights=mead_weights,\n                )\n            (audio, coef_dict, emo_index, _), is_starting_sample = next(mead_stream)\n            use_emotion_loss = True\n            data_name = "mead"\n'''
              text = rep(text, old, new, 'data selection streams', path)

              # Stop Generic workers and free Generic storage before the 190k saves.
              marker = '''        should_validate = (\n            phase > 1\n'''
              cleanup = '''        # The Stage-1 boundary saves two large checkpoints. Before those writes,\n        # terminate Generic workers and release Generic storage if this variant\n        # will not use Generic replay later. This avoids carrying Stage-1 RAM\n        # into the MEAD phase and avoids a boundary memory spike.\n        if iteration == args.stage1_iter and generic_stream is not None:\n            logging.info("Closing Generic workers before Stage-1 checkpoint save")\n            generic_stream.close()\n            generic_stream = None\n            if args.generic_replay_interval <= 0:\n                _release_dataset_storage(generic_dataset)\n            gc.collect()\n\n        should_validate = (\n            phase > 1\n'''
              text = rep(text, marker, cleanup, 'stage1 cleanup marker', path)

              # Disable validation execution entirely while retaining helper functions for compatibility.
              start = text.find('        should_validate = (\n')
              end_marker = '        should_save = (\n'
              end = text.find(end_marker, start)
              if start == -1 or end == -1:
                  raise RuntimeError(f'{path}: validation block bounds not found')
              disabled = '''        # Validation is intentionally disabled for these throughput experiments.\n        # No validation DataLoader is constructed and no evaluate() pass is run.\n\n'''
              text = text[:start] + disabled + text[end:]

              # Close whichever stage pools remain at normal termination.
              old = '''    return best_val, ema_updates\n\n\ndef count_parameters(model):\n'''
              new = '''    for stream in (generic_stream, mead_stream, generic_replay_stream):\n        if stream is not None:\n            stream.close()\n    gc.collect()\n    return best_val, ema_updates\n\n\ndef count_parameters(model):\n'''
              text = rep(text, old, new, 'final stream cleanup', path)

              # Do not construct the validation split/dataloaders in main.
              old = '''    mead_val_dataset = EmoLevelDataset(\n        args.data_root,\n        motion_filename=args.motion_filename,\n        motion_template_filename=args.motion_template_filename,\n        split="test",\n        coef_fps=args.fps,\n        n_motions=args.n_motions,\n        n_prev_motions=args.n_prev_motions,\n        crop_strategy="begin",\n        normalize_type=args.normalize_type,\n    )\n    continuation_val_loader, start_val_loader = build_validation_loaders(\n        mead_val_dataset, args.val_batch_size\n    )\n'''
              new = '''    # Validation is disabled for the 0901 performance runs. Keeping these as\n    # None preserves the train() call signature without loading a second MEAD\n    # split or constructing any validation DataLoader.\n    continuation_val_loader = None\n    start_val_loader = None\n'''
              text = rep(text, old, new, 'validation loader construction', path)

              # Keep worker count and PyTorch default prefetch exactly unchanged.
              if 'parser.add_argument("--num_workers", type=int, default=4)' not in text:
                  raise RuntimeError(f'{path}: num_workers default is no longer 4')
              if 'prefetch_factor' in text:
                  raise RuntimeError(f'{path}: unexpected explicit prefetch_factor found')

              path.write_text(text, encoding='utf-8')
              print('patched', path)
          PY

      - name: Validate Python syntax and requested invariants
        run: |
          python -m py_compile \
            train_Unification_twostage0901_schedule_ema.py \
            train_Unification_twostage0901_sharedcond_ema.py \
            train_Unification_twostage0901_sharedcond_minsnr_ema.py \
            train_Unification_twostage0901_sharedcond_balanced_ema.py \
            train_Unification_twostage0901_sharedcond_minsnr_balanced_ema.py \
            train_Unification_twostage0901_sharedcond_minsnr_balanced_replay_ema.py
          for f in train_Unification_twostage0901_*.py; do
            grep -q 'default=4' "$f"
            grep -q 'Closing Generic workers before Stage-1 checkpoint save' "$f"
            grep -q 'Validation is intentionally disabled' "$f"
            if grep -q 'prefetch_factor' "$f"; then exit 1; fi
          done
          git diff --check

      - name: Commit patched variants
        run: |
          rm -f .github/workflows/patch_0901_stage_workers_no_val.yml
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            train_Unification_twostage0901_schedule_ema.py \
            train_Unification_twostage0901_sharedcond_ema.py \
            train_Unification_twostage0901_sharedcond_minsnr_ema.py \
            train_Unification_twostage0901_sharedcond_balanced_ema.py \
            train_Unification_twostage0901_sharedcond_minsnr_balanced_ema.py \
            train_Unification_twostage0901_sharedcond_minsnr_balanced_replay_ema.py
          git add -u -- .github/workflows/patch_0901_stage_workers_no_val.yml
          git diff --cached --check
          git commit -m 'limit 0901 workers to active stage and disable validation [skip ci]'
          git push origin HEAD:develop
