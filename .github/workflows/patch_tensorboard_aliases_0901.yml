name: Patch TensorBoard compatibility aliases 0901

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/patch_tensorboard_aliases_0901.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Add legacy-compatible TensorBoard tags
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(Path('.').glob('train_Unification_twostage0901_*.py'))
          old = '''            for key in (
                          "total", "primary", "emotion", "expression", "exp_vel",
                          "exp_smooth", "head_angle", "head_vel", "head_smooth",
                          "head_trans",
                      ):
                          writer.add_scalar(f"train/{key}_loss", np.mean(loss_log[key]), iteration)
                      for key, value in lr_dict.items():
          '''
          new = '''            for key in (
                          "total", "primary", "emotion", "expression", "exp_vel",
                          "exp_smooth", "head_angle", "head_vel", "head_smooth",
                          "head_trans",
                      ):
                          writer.add_scalar(f"train/{key}_loss", np.mean(loss_log[key]), iteration)

                      # Keep the original 0819 TensorBoard tag names so old and new
                      # experiments can be compared in the same dashboard.
                      writer.add_scalar("train/simple_loss", np.mean(loss_log["primary"]), iteration)
                      writer.add_scalar("train/exp_loss", np.mean(loss_log["expression"]), iteration)
                      writer.add_scalar("train/head_angle", np.mean(loss_log["head_angle"]), iteration)
                      writer.add_scalar("train/head_vel", np.mean(loss_log["head_vel"]), iteration)
                      writer.add_scalar("train/head_smooth", np.mean(loss_log["head_smooth"]), iteration)
                      writer.add_scalar("train/head_trans", np.mean(loss_log["head_trans"]), iteration)

                      for key, value in lr_dict.items():
          '''
          if len(files) != 6:
              raise RuntimeError(f'Expected 6 variants, found {len(files)}')
          for path in files:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected logging block not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          python -m py_compile train_Unification_twostage0901_*.py
          git diff --check
          rm -f .github/workflows/patch_tensorboard_aliases_0901.yml
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- train_Unification_twostage0901_*.py
          git add -u -- .github/workflows/patch_tensorboard_aliases_0901.yml
          git diff --cached --check
          git commit -m 'preserve TensorBoard comparison tags for 0901 variants [skip ci]'
          git push origin HEAD:develop
