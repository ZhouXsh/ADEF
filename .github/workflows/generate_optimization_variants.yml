name: Generate optimization variants
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/generate_optimization_variants.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: develop, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Generate and validate
        run: |
          cat .github/payload/generator.xz.part.* >/tmp/g.xz
          xz -dc /tmp/g.xz >/tmp/g.py
          python -m py_compile /tmp/g.py
          python /tmp/g.py
          python -m py_compile \
            src/modules/emotion_dit_Unification_jianhua0803_{lipaware,contentresidual,audiopyramid,minsnr_ema}.py \
            train_Unification_jianhua0803_{lipaware,contentresidual,audiopyramid,minsnr_ema}.py
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/generate_optimization_variants.yml
          rm -rf .github/payload
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/modules/emotion_dit_Unification_jianhua0803_{lipaware,contentresidual,audiopyramid,minsnr_ema}.py \
            train_Unification_jianhua0803_{lipaware,contentresidual,audiopyramid,minsnr_ema}.py \
            MODEL_TRAINING_OPTIMIZATION_VARIANTS.md
          git add -u -- .github
          git diff --cached --check
          git commit -m 'add independent model and training optimization variants [skip ci]'
          git push origin HEAD:develop
