name: Patch ablation training lifecycle
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/generate_optimization_variants.yml'
      - '.github/patch_ablation_lifecycle.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: develop, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Patch ablation training scripts
        run: python .github/patch_ablation_lifecycle.py
      - name: Validate syntax and lifecycle guards
        run: |
          python -m py_compile train_Ablation0905_*.py
          git diff --check
          test -z "$(grep -L 'Loading MEAD dataset after Generic resources have been released' train_Ablation0905_*.py | grep -v 'single_stage_mead' || true)"
          grep -q 'expected_audio_only_noop' train_Ablation0905_audio_only.py
      - name: Commit fixes
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add train_Ablation0905_*.py
          git diff --cached --check
          git commit -m 'fix ablation phase lifecycle and audio-only Phase-2 gradients [skip ci]'
          git push origin HEAD:develop
