name: Generate independent model-training optimization variants

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/generate_optimization_variants.yml'
      - '.github/scripts/generate_optimization_variants.py.b64.*'

permissions:
  contents: write

concurrency:
  group: generate-adef-optimization-variants
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct generator
        run: |
          cat .github/scripts/generate_optimization_variants.py.b64.* | base64 --decode > .github/scripts/generate_optimization_variants.py
          python -m py_compile .github/scripts/generate_optimization_variants.py

      - name: Generate complete independent variants
        run: python .github/scripts/generate_optimization_variants.py

      - name: Validate generated Python sources
        run: |
          python -m py_compile \
            src/modules/emotion_dit_Unification_jianhua0803_lipaware.py \
            train_Unification_jianhua0803_lipaware.py \
            src/modules/emotion_dit_Unification_jianhua0803_contentresidual.py \
            train_Unification_jianhua0803_contentresidual.py \
            src/modules/emotion_dit_Unification_jianhua0803_audiopyramid.py \
            train_Unification_jianhua0803_audiopyramid.py \
            src/modules/emotion_dit_Unification_jianhua0803_minsnr_ema.py \
            train_Unification_jianhua0803_minsnr_ema.py
          git diff --check

      - name: Commit generated variants
        run: |
          rm -f .github/workflows/generate_optimization_variants.yml
          rm -f .github/scripts/generate_optimization_variants.py
          rm -f .github/scripts/generate_optimization_variants.py.b64.*
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/modules/emotion_dit_Unification_jianhua0803_lipaware.py \
            train_Unification_jianhua0803_lipaware.py \
            src/modules/emotion_dit_Unification_jianhua0803_contentresidual.py \
            train_Unification_jianhua0803_contentresidual.py \
            src/modules/emotion_dit_Unification_jianhua0803_audiopyramid.py \
            train_Unification_jianhua0803_audiopyramid.py \
            src/modules/emotion_dit_Unification_jianhua0803_minsnr_ema.py \
            train_Unification_jianhua0803_minsnr_ema.py \
            MODEL_TRAINING_OPTIMIZATION_VARIANTS.md \
            .github/workflows/generate_optimization_variants.yml \
            .github/scripts/generate_optimization_variants.py.b64.00 \
            .github/scripts/generate_optimization_variants.py.b64.01 \
            .github/scripts/generate_optimization_variants.py.b64.02 \
            .github/scripts/generate_optimization_variants.py.b64.03 \
            .github/scripts/generate_optimization_variants.py.b64.04 \
            .github/scripts/generate_optimization_variants.py.b64.05 \
            .github/scripts/generate_optimization_variants.py.b64.06 \
            .github/scripts/generate_optimization_variants.py.b64.07 \
            .github/scripts/generate_optimization_variants.py.b64.08
          git diff --cached --check
          git commit -m 'add independent model and training optimization variants [skip ci]'
          git push origin HEAD:develop
