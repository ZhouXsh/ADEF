name: Cleanup legacy wrappers 0905
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/cleanup_legacy0905.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply cleanup
        run: python .github/cleanup_legacy0905.py
      - name: Validate
        run: |
          python -m py_compile src/utils/helper.py src/modules/emotion_dit_Unification_jianhua0803.py src/dataset/dataset_EmotionLevel_clear_jianhua0803.py src/modules/emotion_dit_ablation0905_*.py train_Ablation0905_*.py
          test -z "$(find src -name '*_legacy.py' -print)"
          git diff --check
          grep -q 'emotion_dit_ablation0905_' src/utils/helper.py
          ! grep -q 'emotion_dit_Unification_jianhua0803_minsnr_ema' src/utils/helper.py
      - name: Commit cleanup
        run: |
          rm -f .github/cleanup_legacy0905.py .github/workflows/cleanup_legacy0905.yml
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'clean legacy wrappers and minimize helper changes [skip ci]'
          git push origin HEAD:develop
