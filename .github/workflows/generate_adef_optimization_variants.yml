name: Generate ADEF optimization variants

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/generate_adef_optimization_variants.yml

permissions:
  contents: write

jobs:
  generate:
    if: contains(github.event.head_commit.message, '[generate-variants]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate complete independent model and training variants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          BASE_MODEL = Path('src/modules/emotion_dit_Unification_jianhua0803_legacy.py')
          BASE_TRAIN = Path('train_Unification_jianhua0803.py')
          if not BASE_MODEL.exists() or not BASE_TRAIN.exists():
              raise FileNotFoundError('Expected 0803 full model/training samples were not found.')

          base_model = BASE_MODEL.read_text(encoding='utf-8')
          base_train = BASE_TRAIN.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          def replace_all_checked(text, old, new, label, minimum=1):
              count = text.count(old)
              if count < minimum:
                  raise RuntimeError(f'{label}: expected at least {minimum} matches, found {count}')
              return text.replace(old, new)

          def regex_once(text, pattern, replacement, label, flags=0):
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one regex match, found {count}')
              return new_text

          def replace_between(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f'{label}: start marker not found')
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f'{label}: end marker not found')
              end += len(end_marker)
              return text[:start] + replacement + text[end:]

          MODEL_HEADER = '''# NOTE: This file is a complete, independent copy of
          # emotion_dit_Unification_jianhua0803_legacy.py. It does not import the
          # sample implementation; all changes are implemented directly below.
          '''

          def prepare_model(text):
              text = MODEL_HEADER + text
              old_signature = '''    def __init__(self, device='cuda', target="sample", architecture="decoder",
                           motion_feat_dim=70, fps=25, n_motions=64, n_prev_motions=16,
                           audio_model="hubert", feature_dim=512, n_diff_steps=500,
                           diff_schedule="cosine", cfg_mode="incremental",
                           guiding_conditions="audio,emotion", emo_classes=8,
                           align_mask_width=1):'''
              new_signature = '''    def __init__(self, device='cuda', target="sample", architecture="decoder",
                           motion_feat_dim=70, fps=25, n_motions=64, n_prev_motions=16,
                           audio_model="hubert", feature_dim=512, n_diff_steps=500,
                           diff_schedule="cosine", cfg_mode="incremental",
                           guiding_conditions="audio,emotion", emo_classes=8,
                           align_mask_width=1, n_heads=8, n_layers=8, mlp_ratio=4,
                           use_indicator=True, no_use_learnable_pe=False):'''
              text = replace_once(text, old_signature, new_signature, 'DitTalkingHead signature')

              text = replace_once(
                  text,
                  '''        self.feature_dim = feature_dim

        # Audio encoder''',
                  '''        self.feature_dim = feature_dim
        self.n_heads = n_heads
        self.n_layers = n_layers
        self.mlp_ratio = mlp_ratio
        self.use_indicator = bool(use_indicator)
        self.no_use_learnable_pe = bool(no_use_learnable_pe)

        # Audio encoder''',
                  'store architecture fields',
              )

              text = replace_once(
                  text,
                  '''            motion_feat_dim=self.motion_feat_dim,
            feature_dim=feature_dim,
            align_mask_width=align_mask_width,
        )''',
                  '''            motion_feat_dim=self.motion_feat_dim,
            use_indicator=use_indicator,
            feature_dim=feature_dim,
            n_heads=n_heads,
            n_layers=n_layers,
            mlp_ratio=mlp_ratio,
            align_mask_width=align_mask_width,
            no_use_learnable_pe=no_use_learnable_pe,
        )''',
                  'DenoisingNetwork parameter propagation',
              )

              text = replace_once(
                  text,
                  '''        # 指示器用于指示 最后一个音频片段 中 填充的部分。
        if indicator is not None:
            indicator = torch.cat([''',
                  '''        # 指示器用于指示最后一个音频片段中的有效帧。
        if self.use_indicator and indicator is None:
            indicator = torch.ones(
                motion_feat.shape[:2], device=motion_feat.device,
                dtype=motion_feat.dtype,
            )
        if indicator is not None:
            indicator = indicator.to(dtype=motion_feat.dtype)
            indicator = torch.cat([''',
                  'indicator propagation',
              )

              text = replace_once(
                  text,
                  '''        if ret_traj:
            return traj, motion_at_T, audio_feat_cond
        return traj[0], motion_at_T, audio_feat_cond''',
                  '''        if ret_traj:
            return traj, motion_at_T, audio_feat_saved
        return traj[0], motion_at_T, audio_feat_saved''',
                  'raw sample audio feature return',
              )
              return text

          COMMON_FORWARD_BLOCK = '''        # ---------- 单次上下文音频编码 ----------
          # Starting batch: encode the true first 64 frames once.
          # Continuation batch: concatenate prev 16 + current 64 waveform, encode
          # the complete 80-frame context once, then split by frame index.
          if is_starting_sample:
              current_audio_feat = model.extract_audio_feature(
                  current_audio, frame_num=args.n_motions
              )
              noise, target, _, _ = model(
                  current_motion, current_audio_feat,
                  indicator=indicator, emo_index=emo_index,
              )
              prev_motion_for_loss = None
          else:
              prev_motion_gt = motion_coef_full[:, :args.n_prev_motions]
              prev_audio_raw = audio[:, :n_prev_audio_samples].contiguous()
              context_audio = torch.cat([prev_audio_raw, current_audio], dim=1)
              context_audio_feat = model.extract_audio_feature(
                  context_audio,
                  frame_num=args.n_prev_motions + args.n_motions,
              )
              prev_audio_feat = context_audio_feat[:, :args.n_prev_motions].detach()
              current_audio_feat = context_audio_feat[:, args.n_prev_motions:]
              noise, target, _, _ = model(
                  current_motion, current_audio_feat,
                  prev_motion_gt, prev_audio_feat,
                  indicator=indicator, emo_index=emo_index,
              )
              prev_motion_for_loss = prev_motion_gt
          '''

          def prepare_train(text, module_name, exp_name):
              text = '''# NOTE: This file is a complete, independent copy of
          # train_Unification_jianhua0803.py. It does not import or execute the
          # sample training script; all changes are implemented directly here.
          ''' + text
              text = regex_once(
                  text,
                  r'^from src\.modules\.emotion_dit_Unification_jianhua0803 import DitTalkingHead$',
                  f'from src.modules.{module_name} import DitTalkingHead',
                  'active model import',
                  flags=re.MULTILINE,
              )
              text = regex_once(
                  text,
                  r'^g_exp_name = ".*"$',
                  f'g_exp_name = "{exp_name}"',
                  'experiment name',
                  flags=re.MULTILINE,
              )
              text = replace_once(
                  text,
                  'from src.dataset.dataset_EmotionLevel_clear_jianhua0803 import EmoLevelDataset\n',
                  'from src.dataset.dataset_EmotionLevel_clear_jianhua0803 import EmoLevelDataset\nfrom src.seed import set_global_seed\n',
                  'seed import',
              )

              start_marker = '        # ---------- 模型前向：单数轮次不传 prev，双数轮次传 GT prev ----------\n'
              end_marker = '            prev_motion_for_loss = prev_motion_gt\n'
              text = replace_between(
                  text, start_marker, end_marker, COMMON_FORWARD_BLOCK,
                  'single context audio encoding block',
              )

              text = replace_once(
                  text,
                  '''        align_mask_width    = args.align_mask_width,    # ('--align_mask_width', type=int, default=2, help='width of the alignment mask, non-positive for no mask')
    )''',
                  '''        align_mask_width    = args.align_mask_width,
        n_heads            = args.n_heads,
        n_layers           = args.n_layers,
        mlp_ratio          = args.mlp_ratio,
        use_indicator      = args.use_indicator,
        no_use_learnable_pe = args.no_use_learnable_pe,
    )''',
                  'train model kwargs',
              )

              text = replace_once(
                  text,
                  '    classifier.eval()\n',
                  '    classifier.eval()\n    classifier.requires_grad_(False)\n',
                  'freeze classifier',
              )

              text = replace_once(
                  text,
                  "    parser.add_argument('--mode', type=str, default='train', choices=['train', 'test'])\n",
                  "    parser.add_argument('--mode', type=str, default='train', choices=['train', 'test'])\n    parser.add_argument('--seed', type=int, default=2026)\n",
                  'seed argument',
              )
              text = replace_once(
                  text,
                  '    args = parser.parse_args()\n\n    if args.mode == \'train\':',
                  '    args = parser.parse_args()\n    set_global_seed(args.seed)\n\n    if args.mode == \'train\':',
                  'apply seed',
              )

              accumulation_pattern = re.compile(
                  r'''        loss\.backward\(\).*?\n\n        if args\.clip_grad:.*?\n            torch\.nn\.utils\.clip_grad_norm_\(model\.parameters\(\), max_norm=2\.0\).*?\n\n        if it % args\.gradient_accumulation_steps == 0:.*?\n            optimizer\.step\(\)\n            optimizer\.zero_grad\(\)''',
                  flags=re.DOTALL,
              )
              accumulation_replacement = '''        (loss / args.gradient_accumulation_steps).backward()
          micro_step = it - start_iter + 1
          should_step = (
              micro_step % args.gradient_accumulation_steps == 0
              or it == args.max_iter
          )
          if should_step:
              if args.clip_grad:
                  torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=2.0)
              optimizer.step()
              optimizer.zero_grad(set_to_none=True)'''
              text, count = accumulation_pattern.subn(accumulation_replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f'gradient accumulation upgrade: found {count}')
              text = text.replace('    optimizer.zero_grad()\n    for it in range(', '    optimizer.zero_grad(set_to_none=True)\n    for it in range(', 1)
              text = text.replace(
                  '        if scheduler is not None:\n            scheduler.step()',
                  '        if scheduler is not None and should_step:\n            scheduler.step()',
                  1,
              )
              return text

          def add_lip_residual_head(model):
              constants = '''
          LIP_KEYPOINTS = (6, 12, 14, 17, 19, 20)
          LIP_DIM_INDICES = tuple(
              coordinate
              for keypoint in LIP_KEYPOINTS
              for coordinate in range(keypoint * 3, keypoint * 3 + 3)
          )
          '''
              model = replace_once(
                  model,
                  'from ..config.base_config import make_abs_path\n\n\nclass DiffusionSchedule',
                  'from ..config.base_config import make_abs_path\n' + constants + '\n\nclass DiffusionSchedule',
                  'lip constants',
              )
              old_decoder = '''        self.motion_dec = nn.Sequential(
              nn.Linear(self.feature_dim, self.feature_dim // 2),
              nn.GELU(),
              nn.Linear(self.feature_dim // 2, self.motion_feat_dim),
          )

          self.to(device)'''
              new_decoder = '''        self.motion_dec = nn.Sequential(
              nn.Linear(self.feature_dim, self.feature_dim // 2),
              nn.GELU(),
              nn.Linear(self.feature_dim // 2, self.motion_feat_dim),
          )
          self.lip_residual_dec = nn.Sequential(
              nn.Linear(self.feature_dim, self.feature_dim // 2),
              nn.GELU(),
              nn.Linear(self.feature_dim // 2, len(LIP_DIM_INDICES)),
          )
          nn.init.zeros_(self.lip_residual_dec[-1].weight)
          nn.init.zeros_(self.lip_residual_dec[-1].bias)

          self.to(device)'''
              model = replace_once(model, old_decoder, new_decoder, 'lip residual decoder')
              model = replace_once(
                  model,
                  '''        motion_feat_target = self.motion_dec(feat_out)
          return motion_feat_target''',
                  '''        motion_feat_target = self.motion_dec(feat_out)
          lip_residual = self.lip_residual_dec(feat_out)
          motion_feat_target = motion_feat_target.clone()
          motion_feat_target[..., list(LIP_DIM_INDICES)] += lip_residual
          return motion_feat_target''',
                  'apply lip residual',
              )
              return model

          def add_audio_pyramid(model):
              pyramid = '''
          class AudioTemporalPyramid(nn.Module):
              """Multi-scale, frame-preserving temporal refinement for speech features."""
              def __init__(self, feature_dim):
                  super().__init__()
                  self.branches = nn.ModuleList([
                      nn.Conv1d(feature_dim, feature_dim, kernel_size=k,
                                padding=k // 2, groups=feature_dim)
                      for k in (3, 5, 9)
                  ])
                  self.fuse = nn.Conv1d(3 * feature_dim, feature_dim, kernel_size=1)
                  self.gate = nn.Sequential(
                      nn.Conv1d(2 * feature_dim, feature_dim, kernel_size=1),
                      nn.Sigmoid(),
                  )
                  self.residual_scale = nn.Parameter(torch.zeros(1, feature_dim, 1))

              def forward(self, audio_feat):
                  x = audio_feat.transpose(1, 2)
                  context = self.fuse(torch.cat([branch(x) for branch in self.branches], dim=1))
                  gate = self.gate(torch.cat([x, context], dim=1))
                  refined = x + torch.tanh(self.residual_scale) * gate * context
                  return refined.transpose(1, 2)
          '''
              model = replace_once(
                  model,
                  'def modulate(x, shift, scale):\n    # adaLN 调制： x * (1 + scale) + shift\n    return x * (1 + scale) + shift\n\n\nclass DiTDecoderLayer',
                  'def modulate(x, shift, scale):\n    # adaLN 调制： x * (1 + scale) + shift\n    return x * (1 + scale) + shift\n' + pyramid + '\n\nclass DiTDecoderLayer',
                  'audio pyramid class',
              )
              model = replace_once(
                  model,
                  '            self.audio_feature_map = nn.Linear(768, feature_dim)\n            self.start_audio_feat = nn.Parameter(',
                  '            self.audio_feature_map = nn.Linear(768, feature_dim)\n            self.audio_temporal_pyramid = AudioTemporalPyramid(feature_dim)\n            self.start_audio_feat = nn.Parameter(',
                  'audio pyramid initialization',
              )
              model = replace_once(
                  model,
                  '''        audio_feat = self.audio_feature_map(hidden_states)
          return audio_feat''',
                  '''        audio_feat = self.audio_feature_map(hidden_states)
          audio_feat = self.audio_temporal_pyramid(audio_feat)
          return audio_feat''',
                  'audio pyramid application',
              )
              return model

          def add_channel_gate(model):
              model = replace_once(
                  model,
                  '''            self.adaLN_modulation = nn.Sequential(
                  nn.SiLU(),
                  nn.Linear(emotion_feat_dim, 2 * emotion_feat_dim, bias=True),
              )

          self.to(device)''',
                  '''            self.adaLN_modulation = nn.Sequential(
                  nn.SiLU(),
                  nn.Linear(emotion_feat_dim, 2 * emotion_feat_dim, bias=True),
              )
              self.emotion_channel_gate = nn.Parameter(
                  torch.zeros(1, 1, emotion_feat_dim)
              )

          self.to(device)''',
                  'channel gate parameter',
              )
              model = replace_once(
                  model,
                  '''    @property
          def device(self):''',
                  '''    def apply_emotion_modulation(self, audio_feat, shift, scale):
              normalized = self.audio_norm(audio_feat)
              gate = torch.sigmoid(self.emotion_channel_gate)
              return normalized + gate * (normalized * scale + shift)

          @property
          def device(self):''',
                  'channel gate method',
              )
              pattern = re.compile(
                  r'self\.audio_norm\(([^()\n]+)\) \* \(1 \+ ([A-Za-z_][A-Za-z0-9_]*)\) \+ ([A-Za-z_][A-Za-z0-9_]*)'
              )
              model, count = pattern.subn(
                  r'self.apply_emotion_modulation(\1, \3, \2)', model
              )
              if count < 5:
                  raise RuntimeError(f'channel-gate modulation replacements: found {count}')
              return model

          def add_velocity_prediction(model):
              joint_return = '''        return (
              eps,
              motion_feat_target,
              motion_feat.detach(),
              audio_feat_saved.detach(),
          )'''
              joint_new = '''        if self.target == 'velocity':
              diffusion_target = c0 * eps - c1 * motion_feat
          else:
              diffusion_target = eps
          return (
              diffusion_target,
              motion_feat_target,
              motion_feat.detach(),
              audio_feat_saved.detach(),
          )'''
              model = replace_once(model, joint_return, joint_new, 'joint velocity target')
              independent_return = '        return eps, motion_feat_target, motion_feat.detach(), audio_feat_saved.detach()'
              independent_new = '''        if self.target == 'velocity':
              diffusion_target = c0 * eps - c1 * motion_feat
          else:
              diffusion_target = eps
          return diffusion_target, motion_feat_target, motion_feat.detach(), audio_feat_saved.detach()'''
              model = replace_once(
                  model, independent_return, independent_new,
                  'independent velocity target',
              )
              sample_block = '''            elif self.target == 'sample':
                  c0 = (
                      (1 - alpha_bar_prev) * torch.sqrt(alpha)
                      / (1 - alpha_bar)
                  )
                  c1 = (
                      (1 - alpha) * torch.sqrt(alpha_bar_prev)
                      / (1 - alpha_bar)
                  )
                  motion_next = (
                      c0 * motion_at_t + c1 * target_theta + sigma * z
                  )
              else:
                  raise ValueError(f'Unknown target type: {self.target}')'''
              sample_new = '''            elif self.target == 'sample':
                  c0 = (
                      (1 - alpha_bar_prev) * torch.sqrt(alpha)
                      / (1 - alpha_bar)
                  )
                  c1 = (
                      (1 - alpha) * torch.sqrt(alpha_bar_prev)
                      / (1 - alpha_bar)
                  )
                  motion_next = (
                      c0 * motion_at_t + c1 * target_theta + sigma * z
                  )
              elif self.target == 'velocity':
                  pred_x0 = (
                      torch.sqrt(alpha_bar) * motion_at_t
                      - torch.sqrt(1 - alpha_bar) * target_theta
                  )
                  c0 = (
                      (1 - alpha_bar_prev) * torch.sqrt(alpha)
                      / (1 - alpha_bar)
                  )
                  c1 = (
                      (1 - alpha) * torch.sqrt(alpha_bar_prev)
                      / (1 - alpha_bar)
                  )
                  motion_next = c0 * motion_at_t + c1 * pred_x0 + sigma * z
              else:
                  raise ValueError(f'Unknown target type: {self.target}')'''
              model = replace_once(model, sample_block, sample_new, 'velocity sampler')
              return model

          def add_lip_training(train):
              helpers = '''
          LIP_KEYPOINTS = (6, 12, 14, 17, 19, 20)
          LIP_DIM_INDICES = tuple(
              coordinate
              for keypoint in LIP_KEYPOINTS
              for coordinate in range(keypoint * 3, keypoint * 3 + 3)
          )

          def compute_lip_losses(target, current_motion, prev_motion, n_prev):
              pred = target[:, n_prev:, :63][..., list(LIP_DIM_INDICES)]
              gt = current_motion[:, :, :63][..., list(LIP_DIM_INDICES)]
              loss_pos = torch.nn.functional.smooth_l1_loss(pred, gt)
              loss_vel = torch.nn.functional.smooth_l1_loss(
                  pred[:, 1:] - pred[:, :-1], gt[:, 1:] - gt[:, :-1]
              )
              if pred.shape[1] > 2:
                  pred_acc = pred[:, 2:] - 2 * pred[:, 1:-1] + pred[:, :-2]
                  gt_acc = gt[:, 2:] - 2 * gt[:, 1:-1] + gt[:, :-2]
                  loss_acc = torch.nn.functional.smooth_l1_loss(pred_acc, gt_acc)
              else:
                  loss_acc = pred.new_zeros(())
              if prev_motion is not None:
                  prev_last = prev_motion[:, -1, :63][..., list(LIP_DIM_INDICES)]
                  pred_boundary = pred[:, 0] - prev_last
                  gt_boundary = gt[:, 0] - prev_last
                  loss_boundary = torch.nn.functional.smooth_l1_loss(
                      pred_boundary, gt_boundary
                  )
              else:
                  loss_boundary = pred.new_zeros(())
              return loss_pos, loss_vel, loss_acc, loss_boundary
          '''
              train = replace_once(
                  train,
                  'cross_criterion = torch.nn.CrossEntropyLoss()\n',
                  'cross_criterion = torch.nn.CrossEntropyLoss()\n' + helpers,
                  'lip training helpers',
              )
              train = replace_once(
                  train,
                  '''        exps = target[:, args.n_prev_motions:, :63].clone()                        # (N, n_motions, 63)
          pred_emo, _ = classifier(exps)                                              # (N, 8)
          loss_emo = cross_criterion(pred_emo, emo_index)                             # 不再除以 2（每 iter 仅一段）''',
                  '''        exps = target[:, args.n_prev_motions:, :63].clone()
          emotion_grad_mask = torch.ones_like(exps)
          emotion_grad_mask[..., list(LIP_DIM_INDICES)] = 0
          emotion_input = exps.detach() + emotion_grad_mask * (exps - exps.detach())
          pred_emo, _ = classifier(emotion_input)
          loss_emo = cross_criterion(pred_emo, emo_index)''',
                  'lip stop-gradient emotion loss',
              )
              train = replace_once(
                  train,
                  '        loss_exp_smooth = loss_exp_s\n',
                  '''        loss_exp_smooth = loss_exp_s
          loss_lip_pos, loss_lip_vel, loss_lip_acc, loss_lip_boundary = compute_lip_losses(
              target, current_motion, prev_motion_for_loss, args.n_prev_motions
          )
          ''',
                  'compute lip losses',
              )
              train = replace_once(
                  train,
                  '''        loss_log['exp_smooth'].append(loss_exp_smooth.item() * args.l_exp_smooth)  # l_exp_smooth： 1e-4  权重
          loss = loss + args.l_exp_smooth * loss_exp_smooth''',
                  '''        loss_log['exp_smooth'].append(loss_exp_smooth.item() * args.l_exp_smooth)
          loss = loss + args.l_exp_smooth * loss_exp_smooth

          loss_log['lip_pos'].append(loss_lip_pos.item() * args.l_lip_pos)
          loss_log['lip_vel'].append(loss_lip_vel.item() * args.l_lip_vel)
          loss_log['lip_acc'].append(loss_lip_acc.item() * args.l_lip_acc)
          loss_log['lip_boundary'].append(loss_lip_boundary.item() * args.l_lip_boundary)
          loss = loss + args.l_lip_pos * loss_lip_pos
          loss = loss + args.l_lip_vel * loss_lip_vel
          loss = loss + args.l_lip_acc * loss_lip_acc
          loss = loss + args.l_lip_boundary * loss_lip_boundary''',
                  'add lip losses',
              )
              train = replace_once(
                  train,
                  "    parser.add_argument('--l_exp_smooth', type=float, default=1e-4, help='weight of the head angle loss')  \n",
                  "    parser.add_argument('--l_exp_smooth', type=float, default=1e-4, help='weight of the head angle loss')  \n    parser.add_argument('--l_lip_pos', type=float, default=2.0)\n    parser.add_argument('--l_lip_vel', type=float, default=0.75)\n    parser.add_argument('--l_lip_acc', type=float, default=0.10)\n    parser.add_argument('--l_lip_boundary', type=float, default=0.50)\n",
                  'lip loss arguments',
              )
              return train

          def add_audio_training(train):
              helpers = '''
          def freeze_audio_encoder(model):
              for parameter in model.audio_encoder.parameters():
                  parameter.requires_grad_(False)

          def unfreeze_audio_top_layers(model, num_layers):
              encoder = getattr(model.audio_encoder, 'encoder', None)
              layers = getattr(encoder, 'layers', None)
              if layers is None:
