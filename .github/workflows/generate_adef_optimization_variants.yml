          本目录中的四组实验都严格采用“完整复制样例文件，再在副本中直接修改”的方式生成。模型文件不继承、不导入基础 `emotion_dit_Unification_jianhua0803` 实现；训练文件也不是启动器或 wrapper。

          ## 方案一：Lip-aware residual + 嘴部专项监督

          - 模型：`src/modules/emotion_dit_Unification_jianhua0803_lipaware.py`
          - 训练：`train_Unification_jianhua0803_lipaware.py`
