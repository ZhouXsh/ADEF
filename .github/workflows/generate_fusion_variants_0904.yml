          doc = '''# 0904 Fusion performance variants

These six scripts are **complete independent copies** derived from the successful 6009
`train_Unification_twostage0901_sharedcond_minsnr_balanced_ema.py` path. Existing 0901
files and the model implementation are left unchanged.

## Why this round

The six completed 0901 experiments showed a repeatable trade-off:

- 6008 (shared condition, no Min-SNR/balance) had the strongest PSNR/SSIM/LPIPS/M-LMD.
- 6007 (shared condition + balanced MEAD) had the strongest LSE-D/LSE-C and FID.
- 6010 (shared condition + Min-SNR) had the strongest FVD but weaker spatial metrics.
- 6009 combined Min-SNR + balance and was the best overall Pareto candidate.
- 6011 generic replay did not justify its extra compute and is intentionally excluded.

The 0904 round therefore **does not change the model architecture**. It branches from 6009
and anneals only the training objective / sampler in the late stage. This directly targets
the observed trade-off instead of introducing a new method.

## Recommended common starting point

Use the raw/EMA states in the existing 6009 checkpoint at **350k**:

`experiments/emo_dit/20260901_twostage_sharedcond_minsnr_balanced_ema/checkpoints/iter_0350000.pt`

All variants preserve the 6009 recipe before 350k and train to 450k. Ordinary `iter_*.pt`
checkpoints do not contain Adam state, so these scripts intentionally default to a fresh Adam
state on resume (`--no_resume_optimizer`). This is deliberate for the new tail objective.
If you explicitly resume from a compatible `latest_train_state.pt` and want its Adam moments,
pass `--resume_optimizer`.

## Six-card matrix

| GPU | Script | Min-SNR final mix | Balance final power | Final audio policy | Role |
|---|---|---:|---:|---|---|
| 0 | `train_Unification_twostage0904_fusion_conservative_ema.py` | 0.25 | 0.50 | normal schedule | safest temporal/sync-preserving fusion |
| 1 | `train_Unification_twostage0904_fusion_plain_tail_ema.py` | 0.00 | 0.50 | normal schedule | isolate plain-loss quality recovery |
| 2 | `train_Unification_twostage0904_fusion_balanced_decay_ema.py` | 0.25 | 0.25 | normal schedule | primary Pareto candidate |
| 3 | `train_Unification_twostage0904_fusion_natural_tail_ema.py` | 0.00 | 0.00 | normal schedule | aggressive 6008-like final refinement |
| 4 | `train_Unification_twostage0904_fusion_lowaudio_protect_ema.py` | 0.25 | 0.25 | audio LR <= 2e-7 after 400k | **recommended likely-best candidate** |
| 5 | `train_Unification_twostage0904_fusion_freezeaudio_protect_ema.py` | 0.25 | 0.25 | audio LR = 0 after 400k | test hard alignment protection |

Common tail schedule:

- 350k -> 420k: cosine anneal Min-SNR mix from 1.0 to the variant target.
- 380k -> 430k: cosine anneal balanced-MEAD power from 0.5 to the variant target.
- Balance power is quantized by 0.05 so the persistent DataLoader is rebuilt only at a
  small number of boundaries, not every iteration.
- Protected variants start their low-LR policy at 400k.
- 430k -> 450k is a stable final refinement region at the target objective/sampler.
- Generic replay stays disabled because the completed 6011 experiment regressed core
  emotion/synchronization metrics.

## Six parallel commands

```bash
BASE=experiments/emo_dit/20260901_twostage_sharedcond_minsnr_balanced_ema/checkpoints/iter_0350000.pt

python train_Unification_twostage0904_fusion_conservative_ema.py \
  --device_id 0 --resume_checkpoint "$BASE"

python train_Unification_twostage0904_fusion_plain_tail_ema.py \
  --device_id 1 --resume_checkpoint "$BASE"

python train_Unification_twostage0904_fusion_balanced_decay_ema.py \
  --device_id 2 --resume_checkpoint "$BASE"

python train_Unification_twostage0904_fusion_natural_tail_ema.py \
  --device_id 3 --resume_checkpoint "$BASE"

python train_Unification_twostage0904_fusion_lowaudio_protect_ema.py \
  --device_id 4 --resume_checkpoint "$BASE"

python train_Unification_twostage0904_fusion_freezeaudio_protect_ema.py \
  --device_id 5 --resume_checkpoint "$BASE"
```

If the six jobs share one machine, start them in separate shells/tmux sessions. Do not add
`--resume_optimizer` when branching from `iter_0350000.pt`.

## TensorBoard additions

The original compatible tags remain. New tags are also logged:

- `train/min_snr_mix`
- `train/balance_power`
- `train/primary_plain_loss`
- `train/primary_minsnr_loss`
- `train/audio_protected`

These make it possible to align metric changes with the exact tail transition.

## Selection rule

Do not select only by training loss because the blended primary loss changes definition across
the tail. Run the same `eval/` protocol on at least 400k/420k/430k/440k/450k checkpoints.
The main target is to move the Pareto frontier: retain 6009/6010-level FVD and 6007-level LSE
while recovering toward 6008 spatial/landmark quality. Variant 5 (low-audio protect) is the
current first-choice hypothesis, not a guaranteed winner.
