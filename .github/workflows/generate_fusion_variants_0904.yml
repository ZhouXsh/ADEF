def cosine_anneal_value(iteration, start_iter, end_iter, start_value, end_value):
    """Smoothly move from start_value to end_value with zero-slope endpoints."""
    iteration = int(iteration)
    start_iter = int(start_iter)
    end_iter = int(end_iter)
    if iteration <= start_iter:
        return float(start_value)
    if iteration >= end_iter:
        return float(end_value)
    progress = (iteration - start_iter) / float(max(1, end_iter - start_iter))
    retain = 0.5 * (1.0 + math.cos(math.pi * progress))
    return float(end_value) + (float(start_value) - float(end_value)) * retain


def get_min_snr_mix_weight(args, iteration):
    """Weight of Min-SNR primary loss; the complement is ordinary primary loss."""
    if not args.use_min_snr:
        return 0.0
    phase3_start = args.stage1_iter + args.stage2_emotion_only_iter + 1
    if int(iteration) < phase3_start:
        return 1.0
    return cosine_anneal_value(
        iteration,
        args.loss_anneal_start_iter,
        args.loss_anneal_end_iter,
        1.0,
        args.min_snr_final_weight,
    )


def get_balance_power_for_iteration(args, iteration):
    """Dynamic inverse-frequency power, quantized to avoid rebuilding loaders every step."""
    if not args.balance_mead:
        return 0.0
    phase3_start = args.stage1_iter + args.stage2_emotion_only_iter + 1
    if int(iteration) < phase3_start:
        return float(args.balance_power)
    power = cosine_anneal_value(
        iteration,
        args.balance_anneal_start_iter,
        args.balance_anneal_end_iter,
        args.balance_power,
        args.balance_final_power,
    )
    quantum = float(args.balance_power_quantum)
    if quantum > 0:
        power = round(power / quantum) * quantum
    lo = min(float(args.balance_power), float(args.balance_final_power))
    hi = max(float(args.balance_power), float(args.balance_final_power))
    return min(hi, max(lo, float(power)))


def apply_tail_lr_policy(args, iteration, lr_dict):
    """Optionally protect learned speech-motion alignment during the final refinement tail."""
    if not args.tail_lr_protect or int(iteration) < args.audio_protect_start_iter:
        return lr_dict
    protected = dict(lr_dict)
    protected['backbone'] = min(protected['backbone'], args.tail_backbone_lr_cap)
    protected['audio'] = min(protected['audio'], args.tail_audio_lr_cap)
    protected['emotion'] = min(protected['emotion'], args.tail_emotion_lr_cap)
    protected['start'] = min(protected['start'], args.tail_start_lr_cap)
    return protected
'''

