name: Generate 0904 fusion performance variants

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/generate_fusion_variants_0904.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

